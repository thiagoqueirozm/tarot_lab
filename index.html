<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Mystic Oracle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🔮 Cyber Mystic Oracle 🔮</h1>
<p>Selecione uma opção:</p>
<select id="tipoDeck">
  <option value="todos">Todas as cartas</option>
  <option value="maior">Apenas Arcanos Maiores</option>
  <option value="menor">Apenas Arcanos Menores</option>
</select>
<br><br>
    <label for="pergunta">Qual sua pergunta?</label>
<br><br>


<input
  type="text"
  id="pergunta"
  placeholder="Digite sua pergunta..."
>
<br><br>
    <button id="tirarCarta">Virar carta</button>
<br>

    <section id="resultado">
      <img id="imagemCarta" src="imagens/verso.png" alt="Verso da carta" class="imagem-carta">
      <p id="perguntaExibida"></p>
      <h2 id="nomeCarta"></h2>
      <p id="significadoCarta"></p>
      <p id="simNao"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
